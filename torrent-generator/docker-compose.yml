services:
  torrent-generator:
    image: hollow313/torrent-generator:latest
    container_name: torrent-generator
    restart: unless-stopped
    user: "568:568"
    ports:
      - "30017:30017"
    environment:
      - PORT=30017
      - TZ=Europe/Paris
      - CONFIG_DIR=/config
      - DATA_DIR=/data
      - OUTPUT_DIR=/output
    volumes:
      # Configuration persistante (paramètres et historique)
      - ./config:/config
      # Dossier racine de vos médias sur le serveur
      - /chemin/vers/vos/medias:/data:ro
      # Dossier où seront enregistrés les fichiers .torrent et .nfo générés
      - ./torrents:/output
